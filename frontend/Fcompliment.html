<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="access-control.js"></script>
<title>Nouvelle demande — Information complémentaire</title>
<link rel="stylesheet" href="styleFormulaire.css">
<link rel="stylesheet" href="Stylenav.css">
</head>
<body>

  <div class="app-shell">

  <aside class="sidebar" id="sidebar">
<div class="sidebar-logo-row">
  <div class="logo-badge">
    <img src="/images/logo-icon.png" alt="" class="logo-img">
  </div>
  <div class="logo-text">
    <span>FORGES</span>
    <span>DE BAZAS</span>
  </div>
</div>

    <nav class="sidebar-nav">
      <a href="Dashbord.html" class="nav-item ">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="text">Dashboard</span>
      </a>

      <a href="comercial.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span class="text">Les Demandes</span>
      </a>

      <a href="planification.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="text">Formulaire</span>
      </a>
      <a href="Compte.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text">Mon compte</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="logIn.html" class="nav-item" onclick="localStorage.removeItem('authToken'); localStorage.removeItem('user');">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="text">Déconnecter</span>
      </a>
    </div>
  </aside>

  <main class="page">

    <div class="stepper">
      <div class="step done"><div class="circle">1</div><div class="step-label">Partie commerciale</div></div>
      <div class="step-line"></div>
      <div class="step done"><div class="circle">2</div><div class="step-label">Service spécifique</div></div>
      <div class="step-line"></div>
      <div class="step active"><div class="circle">3</div><div class="step-label">Information complémentaire</div></div>
    </div>

    <form class="wizard-card" onsubmit="event.preventDefault();">
      <h2>Information complémentaire</h2>
      <p class="sub">Ajoutez toute précision utile au service technique.</p>
      <div class="field">
        <label for="priorite">Priorité</label>
        <select id="priorite" data-field>
          <option value="">Sélectionner…</option>
          <option>Normale</option>
          <option>Urgente</option>
        </select>
      </div>

      <div class="field">
        <label for="remarques">Remarques</label>
        <textarea id="remarques" data-field rows="4" placeholder="Consignes particulières, contraintes d'accès…"></textarea>
      </div>

      <div class="wizard-nav">
        <a href="Fcomercial.html" class="btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center;">Précédent</a>
        <div class="nav-right">
          <button type="button" class="btn-secondary" onclick="enregistrerDemande()">Enregistrer</button>
          <button type="button" class="btn-primary" onclick="envoyerDemande()">Envoyer</button>
        </div>
      </div>
    </form>
  </main>

  <script src="formulaire.js"></script>
</body>
</html>
