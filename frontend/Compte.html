</div>

    <div class="app-main">
      <main class="page">
        <div class="page-head">
          <div>
            <h1>Mon compte</h1>
            <p class="sub">Gérez vos informations personnelles et votre sécurité.</p>
          </div>
        </div>

        <div class="account-grid">

          <div class="profile-card">
            <div class="profile-avatar" id="avatarInitials">--</div>
            <h2 id="profileNomComplet">—</h2>
            <p class="profile-role"><span class="role-badge" id="profileRole">—</span></p>
            <p class="profile-since" id="profileDepuis"></p>
          </div>

          <form class="settings-card" id="profilForm">
            <h2><svg viewBox="0 0 24 24" class="card-icon"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Informations personnelles</h2>

            <div class="grid-2">
              <div class="field">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" required>
              </div>
              <div class="field">
                <label for="nom">Nom</label>
                <input type="text" id="nom" required>
              </div>
              <div class="field field-full">
                <label for="email">Email professionnel</label>
                <input type="email" id="email" required>
              </div>
            </div>

            <div class="form-actions">
              <span class="save-hint" id="profilHint"></span>
              <button type="submit" class="btn-primary">Enregistrer</button>
            </div>
          </form>

          <form class="settings-card" id="pwdForm">
            <h2><svg viewBox="0 0 24 24" class="card-icon"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Sécurité</h2>

            <div class="field">
              <label for="pwd-current">Mot de passe actuel</label>
              <input type="password" id="pwd-current" placeholder="••••••••" required>
            </div>
            <div class="grid-2">
              <div class="field">
                <label for="pwd-new">Nouveau mot de passe</label>
                <input type="password" id="pwd-new" required minlength="8">
              </div>
              <div class="field">
                <label for="pwd-confirm">Confirmer</label>
                <input type="password" id="pwd-confirm" required minlength="8">
              </div>
            </div>

            <div class="form-actions">
              <span class="save-hint" id="pwdHint"></span>
              <button type="submit" class="btn-primary">Mettre à jour le mot de passe</button>
            </div>
          </form>

        </div>
      </main>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    function authHeaders() {
      const token = localStorage.getItem('authToken');
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    const ROLE_LABELS = {
      'responsable commercial': 'Responsable commercial',
      'assistant commercial':   'Assistant commercial',
      'responsable technique':  'Responsable technique',
      'assistant technique':    'Assistant technique',
      'technicien':             'Technicien',
      'admin':                  'Administrateur',
    };

    function initiales(prenom, nom) {
      return `${(prenom || '?')[0]}${(nom || '?')[0]}`.toUpperCase();
    }

    async function chargerProfil() {
      const res = await fetch(`${API_BASE}/utilisateurs/moi`, { headers: authHeaders() });
      if (!res.ok) return;
      const u = await res.json();

      document.getElementById('prenom').value = u.prenom;
      document.getElementById('nom').value = u.nom;
      document.getElementById('email').value = u.email_pro;

      document.getElementById('profileNomComplet').textContent = `${u.prenom} ${u.nom}`;
      document.getElementById('profileRole').textContent = ROLE_LABELS[u.role] || u.role;
      document.getElementById('avatarInitials').textContent = initiales(u.prenom, u.nom);
      document.getElementById('profileDepuis').textContent =
        `Membre depuis ${new Date(u.date_creation).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}`;
    }

    function showHint(el, message, ok = true) {
      el.textContent = message;
      el.className = `save-hint ${ok ? 'save-hint-ok' : 'save-hint-error'} visible`;
      setTimeout(() => el.classList.remove('visible'), 3000);
    }

    document.getElementById('profilForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const hint = document.getElementById('profilHint');
      const res = await fetch(`${API_BASE}/utilisateurs/moi`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({
          prenom: document.getElementById('prenom').value,
          nom: document.getElementById('nom').value,
          emailPro: document.getElementById('email').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) return showHint(hint, data.error, false);
      showHint(hint, 'Profil mis à jour ✓');
      chargerProfil();
    });

    document.getElementById('pwdForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const hint = document.getElementById('pwdHint');
      const ancien = document.getElementById('pwd-current').value;
      const nouveau = document.getElementById('pwd-new').value;
      const confirm = document.getElementById('pwd-confirm').value;

      if (nouveau !== confirm) return showHint(hint, 'La confirmation ne correspond pas.', false);

      const res = await fetch(`${API_BASE}/utilisateurs/moi/mot-de-passe`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ ancienMotDePasse: ancien, nouveauMotDePasse: nouveau }),
      });
      const data = await res.json();
      if (!res.ok) return showHint(hint, data.error, false);

      showHint(hint, 'Mot de passe mis à jour ✓');
      e.target.reset();
    });

    document.addEventListener('DOMContentLoaded', chargerProfil);
  </script>
  <script src="nav.js"></script>
</body>
</html>
