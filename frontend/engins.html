<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="access-control.js"></script>
<title>Catalogue des engins — Forges de Bazas</title>
<link rel="stylesheet" href="Styleengins.css">
<link rel="stylesheet" href="Stylenav.css">
</head>
<body>
  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
<div class="sidebar-logo-row">
  <div class="logo-badge">
    <img src="/images/logo-icon.png" alt="" class="logo-img">
  </div>
  <div class="logo-text">
    <span>FORGES</span>
    <span>DE BAZAS</span>
  </div>
</div>
      <nav class="sidebar-nav">
        <a href="Dashbord.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="text">Dashboard</span>
        </a>
        <a href="engins.html" class="nav-item active">
          <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          <span class="text">Engins</span>
        </a>
        <a href="Technique.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span class="text">Service technique</span>
        </a>
        <a href="planification.html" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="text">Planning</span>
        </a>
        <a href="Compte.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text">Mon compte</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="logIn.html" class="nav-item" onclick="localStorage.removeItem('authToken'); localStorage.removeItem('user');">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="text">Déconnecter</span>
        </a>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-title">Catalogue des engins</div>
        <div class="topbar-actions">
          <button class="icon-btn" title="Rechercher" data-search-target=".engin-grid .engin-card">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          
          <div class="user">
            <span class="user-avatar">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <div class="user-info">
              <span class="user-name"></span>
              <span class="user-role"></span>
            </div>
          </div>
        </div>
      </header>

      <main class="page">
        <div class="page-head">
          <div>
            <h1>Catalogue des engins</h1>
            <p class="sub">8 modèles référencés. Sélectionnez une fiche pour voir le détail d'intervention.</p>
          </div>
        </div>

        <div class="engin-grid" id="enginGrid"></div>

        <div class="page-footer">
          <a href="Ajouterengin.html" class="btn-primary">+ Ajouter un engin</a>
        </div>
      </main>
    </div>
  </div>

  <div class="drawer-overlay" id="drawerOverlay">
    <div class="detail-modal">

      <div class="detail-header">
        <button class="drawer-close" onclick="closeDetail()">&times;</button>
        <span class="eyebrow">Détail de l'engin</span>
        <div class="drawer-specs" id="detailSpecs"></div>
      </div>

      <div class="detail-columns">

        <section class="drawer-section">
          <h3 class="drawer-section-title">Option</h3>
          <div class="option-simple-list" id="optionsSimpleList"></div>
        </section>

        <section class="drawer-section">
          <h3 class="drawer-section-title">Pièces</h3>
          <div class="pieces-list" id="piecesList"></div>
        </section>

        <section class="drawer-section">
          <h3 class="drawer-section-title">Temps</h3>
          <div class="time-list" id="timeList"></div>
        </section>

      </div>
    </div>
  </div>
  <script>document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});</script>
  <script src="engins.js"></script>
  <script src="nav.js"></script>
</body>
</html>
